Results:
  save_results: True
  save_dir: "results"
  save_trj: True
  save_trj_kf_intv: 10
  use_gui: False
  eval_rendering: True
  use_wandb: False
  color_refinement: False
  profile_timing: True
  
Dataset:
  type: 'waymo'
  sensor_type: 'monocular'
  pcd_downsample: 64
  pcd_downsample_init: 32
  adaptive_pointsize: True
  point_size: 0.01

Tracking:
  pose_init: "constant_velocity"
  use_dust3r_every_frame: False
  wait_for_keyframe_backend: True
  depth_tracking_buffer: 3
  use_depth_local_map: True
  depth_min: 0.1
  depth_max: 80.0

MappingOptimization:
  selective_keyframe_insertion: True
  use_render_coverage_mask: True
  use_rgb_residual_mask: True
  use_depth_residual_mask: True
  use_dust3r_confidence_mask: True

  opacity_insert_th: 0.35
  rgb_residual_insert_th: 0.08
  depth_residual_insert_ratio_th: 0.08

  max_new_gaussians_per_kf: 30000
  min_new_gaussians_per_kf: 3000
  insertion_mask_dilate: 3

  adaptive_mapping_iters: True
  small_insert_gaussians: 5000
  small_insert_iters: 20
  medium_insert_gaussians: 30000
  medium_insert_iters: 50
  low_coverage_full_mapping_th: 0.55

  smart_pruning: True
  recent_density_keyframes: 3
  prune_opacity_th: 0.05
  prune_min_observations: 3
  prune_large_screen_radius: True

Training:
  init_itr_num: 200 #1050
  init_gaussian_update: 100
  init_gaussian_reset: 500
  init_gaussian_th: 0.005
  init_gaussian_extent: 30
  tracking_itr_num: 20 #100
  mapping_itr_num: 50 #150
  gaussian_update_every: 150
  gaussian_update_offset: 50
  gaussian_th: 0.7
  gaussian_extent: 1.0
  gaussian_reset: 2001
  size_threshold: 20
  kf_interval: 6
  window_size: 8
  pose_window: 3
  edge_threshold: 1.1
  rgb_boundary_threshold: 0.01

  kf_translation: 0.08
  kf_min_translation: 0.05
  kf_overlap: 0.9
  kf_cutoff: 0.3
  prune_mode: 'slam'
  single_thread: False
  spherical_harmonics: True

  lr:
    cam_rot_delta: 0.003
    cam_trans_delta: 0.001

opt_params:
  iterations: 30000
  position_lr_init: 0.0016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.001
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002

model_params:
  sh_degree: 0
  source_path: ""
  model_path: ""
  resolution: -1
  white_background: False
  data_device: "cuda"

pipeline_params:
  convert_SHs_python: False
  compute_cov3D_python: False
